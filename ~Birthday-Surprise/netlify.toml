# Netlify Configuration for Birthday Surprise Interactive Keepsake
[build]
  publish = "dist"
  command = "npm run build"

# Single Page Application (SPA) Client Routing Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Optimization Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
